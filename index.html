<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>元数据管理 - 离线桌面元数据工具</title>
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("clear-meta-theme");
        } catch (e) {
          /* 存储不可用时使用默认深色 */
        }
        document.documentElement.setAttribute(
          "data-theme",
          theme === "light" ? "light" : "dark",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
