name: 打包与发布（Windows / macOS）

# 触发方式：
#   1) push / PR 到 main：只跑类型检查与回归，不打包
#   2) 打 tag：git tag v0.1.1 && git push origin v0.1.1 → 构建并创建草稿 Release
#   3) 手动：Actions 页 → Run workflow（重新打包验证）
#
# 产物统一 ASCII 命名，四件套（版本号取自 package.json）：
#   ClearMeta-<version>-setup-win-x64.exe
#   ClearMeta-<version>-portable-win-x64.zip
#   ClearMeta-<version>-aarch64.dmg
#   ClearMeta-<version>-aarch64.app.zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: 类型检查与回归
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:regression

  build-windows:
    name: Windows（安装版 + 便携版 + Rust 回归）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "版本：$v"

      - name: Rust 文件处理回归
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: 构建 Tauri（NSIS 安装版）
        run: npm run tauri build

      - name: 打包便携版 zip（exe + 文档 + 许可）
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ver = $env:APP_VERSION
          $root = "release/ClearMeta-$ver-portable-win-x64"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item src-tauri/target/release/clear-meta.exe $root
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'docs') | Out-Null
          Get-ChildItem docs -Filter '*.md' -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $root 'docs') -Force }
          foreach ($name in @('README.md', 'LICENSE', 'LICENSE.zh-CN.md')) {
            Copy-Item $name $root -Force
          }
          # 从模板读取，避免多行字符串破坏 workflow 的 YAML 结构。
          $notePath = Join-Path $root ([char]0x4f7f + [char]0x7528 + [char]0x8bf4 + [char]0x660e + '.txt')
          $note = (Get-Content docs/portable-readme.txt -Raw -Encoding UTF8).Replace('{{VERSION}}', $ver)
          [System.IO.File]::WriteAllText($notePath, $note, [System.Text.UTF8Encoding]::new($true))
          Compress-Archive -Path $root -DestinationPath "release/ClearMeta-$ver-portable-win-x64.zip" -Force

      - name: 规范化安装版文件名为 ASCII
        shell: pwsh
        run: |
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $nsis) { throw '未找到 NSIS 安装包' }
          Copy-Item $nsis.FullName "release/ClearMeta-$($env:APP_VERSION)-setup-win-x64.exe" -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-and-portable
          path: |
            release/ClearMeta-${{ steps.ver.outputs.version }}-setup-win-x64.exe
            release/ClearMeta-${{ steps.ver.outputs.version }}-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS（dmg + app，Apple Silicon）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 未签名构建：首次打开可能触发 Gatekeeper，可执行 xattr -dr com.apple.quarantine。
      - name: 构建 Tauri（macOS .app + .dmg）
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: 规范化 macOS 产物文件名（ASCII + app.zip）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$dmg" ] || { echo "未找到 dmg"; exit 1; }
          [ -n "$app" ] || { echo "未找到 app"; exit 1; }
          cp "$dmg" "release/ClearMeta-${{ steps.ver.outputs.version }}-aarch64.dmg"
          ditto -c -k --keepParent "$app" "release/ClearMeta-${{ steps.ver.outputs.version }}-aarch64.app.zip"
          ls -lh release/

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: |
            release/ClearMeta-${{ steps.ver.outputs.version }}-aarch64.dmg
            release/ClearMeta-${{ steps.ver.outputs.version }}-aarch64.app.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建草稿 Release（仅打 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 显式绑定 tag，否则草稿会落在 untagged-* 上，发布后链接不稳定。
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*
